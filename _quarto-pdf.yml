# פרופיל PDF — מרנדר את אותם קובצי QMD של האתר ל-PDF.
# הפעלה:  quarto render --profile pdf --to pdf
# מנוע lualatex + babel (עברית RTL), פונט Frank Ruehl CLM, ותיבות המשפט הצבעוניות הקיימות.
#
# חשוב: ב-_quarto.yml השפה מוגדרת כ-book.language, ואין lang עליון. בלי lang עליון,
# pandoc לא מעביר את השפה ל-babel, ולכן babel לא הופך את עברית לשפה הראשית והמסמך יוצא
# LTR (טקסט צמוד לשמאל). ה-lang כאן מפעיל את babel עם עברית כשפה ראשית = כיוון RTL אמיתי.
lang: he
format:
  pdf:
    documentclass: scrbook
    dir: rtl                       # כיוון בסיס RTL — יישור פסקאות לימין (בלעדיו הטקסט צמוד לשמאל)
    pdf-engine: lualatex
    mainfont: "Frank Ruehl CLM"
    sansfont: "Frank Ruehl CLM"
    monofont: "Frank Ruehl CLM"
    toc: true
    toc-title: "תוכן העניינים"   # אחרת ברירת המחדל היא "Table of contents" באנגלית
    number-sections: true
    suppress-bibliography: true   # אין ציטוטים בפועל; מונע CSLReferences ריק שקורס ב-LaTeX
    fig-pos: 'H'
    include-in-header:
      - math-macros.tex
      - pdf-env-boxes.tex
      - pdf-solution-hint.tex
      - pdf-extra-envs.tex
    filters:
      - pdf-callout-to-mdframed.lua
      - wrap-bare-math.lua
      - pdf-sim-placeholder.lua
      - div-to-theorem-env.lua
      - uncollapse-for-pdf.lua
      - env-to-callout.lua
